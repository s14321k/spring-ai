plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smartshop.customer'
version = '0.0.1-SNAPSHOT'
description = 'springboot-ai'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    // Core Spring Boot web starter — provides Tomcat, Spring MVC, Jackson, and validation.
    // Required for any REST controller-based application.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Lombok dependency
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // ═══════════════════════════════════════════════════════════════════════════════
    // AI Model Provider Starters — pick the ones you actually need for your deployment.
    // You do NOT need all three in production; they are included here for demonstration
    // and local experimentation with multiple backends.
    // ═══════════════════════════════════════════════════════════════════════════════

    // Google Gemini (Google GenAI) starter.
    // Brings in the client, auto-configuration, and chat model abstraction for Gemini.
    // Use this when you want to call Google's Gemini API (e.g., gemini-1.5-flash, gemini-1.5-pro).
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    // Ollama starter.
    // Connects to a locally running Ollama server (http://localhost:11434 by default).
    // Ideal for local development, offline usage, or self-hosted open-source models
    // (e.g., llama3, mistral, phi3) without relying on cloud APIs.
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // OpenAI-compatible starter.
    // Provides the OpenAI chat client and auto-configuration. In this project it is used
    // to talk to a local Gemma 3 model served via an OpenAI-compatible Docker container,
    // but it also works with the official OpenAI API, Azure OpenAI, or any proxy that
    // mimics the OpenAI /v1/chat/completions protocol.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // ═══════════════════════════════════════════════════════════════════════════════
    // Observability, Production & Persistence
    // ═══════════════════════════════════════════════════════════════════════════════

    // Spring Boot Actuator — exposes health checks, metrics, and info endpoints.
    // Useful for monitoring token usage, memory stats, and overall app health in production.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JDBC-backed chat memory repository starter.
    // Persists conversation history in a relational database (e.g., H2, PostgreSQL)
    // instead of keeping it only in RAM. Required when you need conversation memory
    // to survive application restarts or when running multiple app instances.
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

    // H2 in-memory database — scoped to tests only.
    // Provides a lightweight DB for integration tests that exercise the JDBC chat memory
    // without requiring an external PostgreSQL instance.
    // ═══════════════════════════════════════════════════════════════════════════════
    // H2 Database — Runtime Scope
    // ═══════════════════════════════════════════════════════════════════════════════
    // Provides BOTH the in-memory database engine AND the embedded H2 Console web UI.
    //
    // WHY runtimeOnly INSTEAD OF testRuntimeOnly?
    // --------------------------------------------
    // The JDBC chat memory repository needs a live DataSource at runtime. By keeping H2
    // as a runtime dependency (not just test-scoped), we get an in-memory database for
    // local development without installing PostgreSQL or MySQL.
    //
    // SPRING 4.x / SPRING BOOT CONTEXT:
    // ----------------------------------
    // In plain Spring Framework 4.x (pre-Spring Boot or before Boot 1.3), enabling the
    // H2 Console meant manually registering the H2 WebServlet in web.xml or Java config:
    //
    //     ServletRegistration.Dynamic h2Console = servletContext.addServlet(
    //         "h2Console", new org.h2.server.web.WebServlet());
    //     h2Console.addMapping("/h2-console/*");
    //
    // Starting with Spring Boot 1.3+ (built on Spring 4.2+), this boilerplate disappeared.
    // Spring Boot's auto-configuration detects H2 on the classpath and automatically sets
    // up the console at /h2-console when:
    //
    //     spring.h2.console.enabled=true
    //
    // The console itself lives inside the H2 jar — there is NO separate
    // "spring-boot-h2-console" dependency. We simply need the H2 jar present at runtime.
    // ═══════════════════════════════════════════════════════════════════════════════
    runtimeOnly 'com.h2database:h2'
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-h2console
    implementation 'org.springframework.boot:spring-boot-h2console:4.0.0-M1'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ═══════════════════════════════════════════════════════════════════════════════
    // Development & Testing
    // ═══════════════════════════════════════════════════════════════════════════════

    // Spring Boot DevTools — enables automatic restart and live reload during development.
    // Disabled automatically in packaged jars; safe to keep in the build file.
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Spring MVC test starter — brings MockMvc, JSON path matchers, and test slices
    // for writing unit and integration tests against your REST controllers.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // JUnit Platform Launcher — required by Gradle to discover and execute JUnit 5 tests.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

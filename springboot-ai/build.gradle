plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smartshop.customer'
version = '0.0.1-SNAPSHOT'
description = 'springboot-ai'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

//    -------gemini---------This dependency is used to connect with gemini
//    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

//    -------ollama---------This dependency is used to connect with ollama which is downloaded from ollama website
//    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

//    -------openai for docker gemma3---------This is openai model dependency
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
